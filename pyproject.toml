[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-engineering"
version = "0.2.0"
description = "An inspectable, versioned graph harness for story engineering research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "networkx>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
narrative = "narrative.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
